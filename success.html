<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Thank You | Syntrivo Technologies</title>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 24px;

            background: #f7f8fc;

            color: #111827;

            font-family: "DM Sans", sans-serif;

        }

        .box {

            width: 100%;

            max-width: 600px;

            padding: 55px 40px;

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 24px;

            text-align: center;

            box-shadow:
                0 25px 70px rgba(17,24,39,.08);

        }

        h1 {

            font-family: "Manrope", sans-serif;

            font-size: 42px;

            letter-spacing: -2px;

        }

        p {

            color: #667085;

            line-height: 1.7;

        }

        a {

            display: inline-block;

            margin-top: 20px;

            padding: 13px 22px;

            background: #111827;

            color: white;

            border-radius: 10px;

            text-decoration: none;

            font-weight: 700;

        }

    </style>

</head>


<body>

    <div class="box">

        <div style="font-size:48px;">
            ✓
        </div>

        <h1>
            Thank you.
        </h1>

        <p>
            Your project enquiry has been received.
            We'll review the details and get back to you.
        </p>

        <a href="index.html">
            Back to Syntrivo
        </a>

    </div>

</body>

</html>
